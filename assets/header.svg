<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05060F"/>
      <stop offset="0.55" stop-color="#0B0F24"/>
      <stop offset="1" stop-color="#120A26"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4"/>
      <stop offset="0.5" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5D4"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
    .float1 { animation: float 9s ease-in-out infinite; }
    .float2 { animation: float 12s ease-in-out infinite reverse; }
    @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-18px); } }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.4s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .typing { animation: type 3.2s steps(46,end) 1.6s both; }
    @keyframes type { from { width: 0; } to { width: 660px; } }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateX(-400px); } to { transform: translateX(1300px); } }

    .orbit { transform-origin: 980px 190px; animation: spin 18s linear infinite; }
    .orbit2 { transform-origin: 980px 190px; animation: spin 28s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="float1" cx="1000" cy="80" r="240" fill="url(#glowA)"/>
    <circle class="float2" cx="160" cy="360" r="220" fill="url(#glowB)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle class="tw" cx="620" cy="40" r="1.4"/>
      <circle class="tw" style="animation-delay:.7s" cx="760" cy="320" r="1.2"/>
      <circle class="tw" style="animation-delay:1.3s" cx="540" cy="300" r="1"/>
      <circle class="tw" style="animation-delay:2s" cx="1140" cy="340" r="1.4"/>
      <circle class="tw" style="animation-delay:.4s" cx="820" cy="60" r="1"/>
      <circle class="tw" style="animation-delay:1.8s" cx="420" cy="30" r="1.2"/>
      <circle class="tw" style="animation-delay:2.4s" cx="80" cy="50" r="1"/>
    </g>

    <!-- scanning light -->
    <rect class="scan" x="0" y="0" width="160" height="380" fill="#ffffff" opacity="0.025" transform="skewX(-20)"/>

    <!-- orbit system (right side) -->
    <g opacity="0.95">
      <circle cx="980" cy="190" r="118" stroke="#7B61FF" stroke-opacity="0.35" stroke-dasharray="2 8"/>
      <circle cx="980" cy="190" r="80" stroke="#00F5D4" stroke-opacity="0.35"/>
      <circle cx="980" cy="190" r="44" stroke="#FF4FD8" stroke-opacity="0.35" stroke-dasharray="6 6"/>
      <circle cx="980" cy="190" r="22" fill="#7B61FF" filter="url(#soft)" class="pulse"/>
      <text x="980" y="196" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#E6E9FF">&lt;/&gt;</text>
      <g class="orbit">
        <circle cx="1098" cy="190" r="7" fill="#7B61FF"/>
        <circle cx="862" cy="190" r="4" fill="#FF4FD8"/>
      </g>
      <g class="orbit2">
        <circle cx="980" cy="110" r="6" fill="#00F5D4"/>
        <circle cx="980" cy="270" r="3.5" fill="#E6E9FF"/>
      </g>
      <g class="orbit" style="animation-duration:9s">
        <circle cx="1024" cy="190" r="4" fill="#00F5D4"/>
      </g>
      <text x="980" y="338" text-anchor="middle" class="mono" font-size="11" fill="#8B93C7" letter-spacing="3">DOMAIN · USE CASES · ADAPTERS · UI</text>
    </g>

    <!-- left content -->
    <g class="rise d1">
      <rect x="70" y="62" width="214" height="30" rx="15" fill="#00F5D4" fill-opacity="0.08" stroke="#00F5D4" stroke-opacity="0.5"/>
      <circle cx="90" cy="77" r="4.5" fill="#00F5D4" class="pulse"/>
      <text x="104" y="82" class="mono" font-size="13" fill="#00F5D4" letter-spacing="1">AVAILABLE FOR WORK</text>
    </g>

    <g class="rise d2">
      <text x="68" y="158" class="sans" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Matheus Brandão</text>
    </g>

    <g class="rise d3">
      <text x="70" y="200" class="sans" font-size="22" font-weight="500" fill="#C9CEF5">Full Stack Developer <tspan fill="#7B61FF">·</tspan> Systems Analyst <tspan fill="#7B61FF">·</tspan> Product Builder</text>
    </g>

    <rect class="rise d3" x="70" y="226" width="520" height="2" fill="url(#line)"/>

    <!-- typed line -->
    <svg x="70" y="248" width="680" height="40" overflow="hidden">
      <svg class="typing" x="0" y="0" height="40" width="660" overflow="hidden">
        <text x="0" y="26" class="mono" font-size="18" fill="#8B93C7"><tspan fill="#00F5D4">❯</tspan> building software that is <tspan fill="#FF4FD8">built to evolve</tspan>_</text>
      </svg>
    </svg>

    <g class="rise d4">
      <text x="70" y="330" class="mono" font-size="13" fill="#5E6699">// web · mobile · apis · clean architecture</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="21.5" stroke="#7B61FF" stroke-opacity="0.35"/>
  </g>
</svg>
